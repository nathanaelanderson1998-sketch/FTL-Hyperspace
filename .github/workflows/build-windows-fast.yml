name: 'Build Windows release (fast)'
# Only the Windows release DLL (what the Fold 7 bundle ships), compiled through a ccache kept between runs, for
# quick test turnaround. The full Linux & Windows build (build-linux-windows.yml) still runs before a release.
on:
  push:
    branches: [touch-ui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore compile cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-release-${{ github.sha }}
          restore-keys: ccache-windows-release-

      - name: Build
        run: buildscripts/docker-run-in-devcontainer.sh buildscripts/windows/build-releaseonly-ccache.sh
        env:
          HS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HS_BUILD_HASH: ${{ github.sha }}

      - name: Make the cache readable for saving
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ccache || true

      - name: Store output
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-binary
          path: build-windows-release/Hyperspace.dll
